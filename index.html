<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Geometric Breathing Oasis</title>
    <style>
        :root {
            --bg-color: #121214;
            --container-bg: #1a1a1e;
            --text-main: #E2E2E5;
            --text-muted: #A3A3AC;
            --accent-line: #E2E2E5;
            --accent-glow: rgba(226, 226, 229, 0.35);
            --border-ui: #4A4A52;
        }

        .theme-bw {
            --bg-color: #000000;
            --container-bg: #111111;
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --accent-line: #FFFFFF;
            --accent-glow: rgba(255, 255, 255, 0.2);
            --border-ui: #444444;
        }

        .theme-amethyst {
            --bg-color: #130f1a;
            --container-bg: #1c1626;
            --text-main: #f0e6ff;
            --text-muted: #a692c2;
            --accent-line: #cca3ff;
            --accent-glow: rgba(204, 163, 255, 0.3);
            --border-ui: #574673;
        }

        .theme-jungle {
            --bg-color: #0b1411;
            --container-bg: #13221d;
            --text-main: #e6f7f2;
            --text-muted: #8cbfae;
            --accent-line: #5cd6ad;
            --accent-glow: rgba(92, 214, 173, 0.3);
            --border-ui: #2e594b;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 400px;
            background: var(--container-bg);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            border: 1px solid var(--border-ui);
            transition: all 0.5s ease;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
        }

        .control-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.4rem;
        }

        select, input[type="range"], input[type="password"] {
            background: var(--bg-color);
            border: 1px solid var(--border-ui);
            color: var(--text-main);
            padding: 0.6rem;
            font-size: 0.9rem;
            border-radius: 8px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        input[type="range"] {
            height: 8px;
            cursor: pointer;
        }

        .canvas-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 1.5rem auto;
        }

        canvas {
            background-color: var(--bg-color);
            border-radius: 50%;
            transition: all 0.5s ease;
        }

        .instruction-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            text-align: center;
            width: 80%;
        }

        .instruction {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 0.2rem;
        }

        .countdown {
            font-size: 2.2rem;
            font-weight: 200;
            color: var(--text-main);
        }

        .controls-row {
            margin-top: 1.5rem;
            display: flex;
            gap: 12px;
        }

        button {
            background: transparent;
            border: 1px solid var(--border-ui);
            color: var(--text-muted);
            padding: 0.7rem 1.2rem;
            font-size: 0.85rem;
            border-radius: 20px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            flex: 1;
        }

        button:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }

        button.active {
            background: var(--text-main);
            color: var(--bg-color);
            border-color: var(--text-main);
            font-weight: bold;
        }

        .gate-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111113;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 2rem;
            box-sizing: border-box;
        }

        .etsy-link {
            display: inline-block;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #ffa500;
            text-decoration: none;
            border: 1px dashed #ffa500;
            padding: 0.5rem 1rem;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .etsy-link:hover {
            background: rgba(255, 165, 0, 0.1);
            color: #ffb833;
        }
    </style>
</head>
<body class="theme-bw">

    <div class="container">
        <div id="authGate" class="gate-screen">
            <h2 style="font-weight: 300; letter-spacing: 3px; color: #A3A3AC;">ACCESS VERIFICATION</h2>
            <p style="font-size: 0.85rem; color: #888888; margin-bottom: 1.5rem;">Please enter your personal license access key found inside your Etsy purchase download.</p>
            <input type="password" id="passKey" placeholder="Enter License Key Here..." style="text-align: center; margin-bottom: 1rem;">
            <button id="unlockBtn" style="background: #E2E2E5; color: #121214; font-weight: bold; width: 100%;">VERIFY LICENSE</button>
            <div id="gateError" style="color: #ff6666; font-size: 0.85rem; margin-top: 1rem; visibility: hidden;">Invalid Key. Please check your spelling.</div>
            
            <a href="https://hellorisingsunshop.etsy.com" target="_blank" class="etsy-link">🛍️ Need a License Key? Visit Our Etsy Shop</a>
        </div>

        <div id="appInterface" style="opacity: 0.1; pointer-events: none;">
            <h1>GEOMETRIC CALM</h1>
            
            <div class="control-group">
                <label for="patternSelect">Pattern</label>
                <select id="patternSelect">
                    <option value="478">4-7-8 Calm Reset</option>
                    <option value="box">Box Breathing</option>
                    <option value="equal">Equal Grounding</option>
                </select>
            </div>

            <div class="control-group">
                <label for="themeSelect">Theme Palette</label>
                <select id="themeSelect">
                    <option value="bw">Minimalist Black & White</option>
                    <option value="amethyst">Amethyst Zen</option>
                    <option value="jungle">Monstera Jungle</option>
                </select>
            </div>

            <div class="control-group">
                <label for="geometrySlider">Line Complexity</label>
                <input type="range" id="geometrySlider" min="3" max="12" value="4">
            </div>

            <div class="canvas-container">
                <canvas id="visualizer" width="280" height="280"></canvas>
                <div class="instruction-box">
                    <div id="instruction" class="instruction">READY</div>
                    <div id="countdown" class="countdown">--</div>
                </div>
            </div>

            <div class="controls-row">
                <button id="playBtn">START</button>
                <button id="soundBtn">SOUND: OFF</button>
            </div>
        </div>
    </div>
        <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const instructionText = document.getElementById('instruction');
        const countdownText = document.getElementById('countdown');
        const playBtn = document.getElementById('playBtn');
        const soundBtn = document.getElementById('soundBtn');
        const patternSelect = document.getElementById('patternSelect');
        const themeSelect = document.getElementById('themeSelect');
        const geometrySlider = document.getElementById('geometrySlider');

        const authGate = document.getElementById('authGate');
        const appInterface = document.getElementById('appInterface');
        const passKey = document.getElementById('passKey');
        const unlockBtn = document.getElementById('unlockBtn');
        const gateError = document.getElementById('gateError');

        let isRunning = false;
        let isSoundOn = false;
        let startTime = 0;
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;

        unlockBtn.addEventListener('click', () => {
            if (passKey.value.trim() === 'BREATHE_NOW') {
                authGate.style.display = 'none';
                appInterface.style.opacity = '1';
                appInterface.style.pointerEvents = 'all';
            } else {
                gateError.style.visibility = 'visible';
                passKey.value = '';
            }
        });

        passKey.addEventListener('focus', () => {
            gateError.style.visibility = 'hidden';
        });

        const patterns = {
            '478': { inhale: 4000, hold1: 7000, exhale: 8000, hold2: 0 },
            'box': { inhale: 4000, hold1: 4000, exhale: 4000, hold2: 4000 },
            'equal': { inhale: 4000, hold1: 0, exhale: 4000, hold2: 0 }
        };

        function startAudioEngine() {
            // Always rebuild the hardware connection fresh to prevent phone freeze out
            if (audioCtx) {
                try { audioCtx.close(); } catch(e) {}
            }
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(110, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }

        function stopAudioEngine() {
            if (gainNode && audioCtx) {
                gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
            }
            setTimeout(() => {
                if (!isRunning && audioCtx) {
                    try { audioCtx.close(); } catch(e) {}
                    audioCtx = null;
                }
            }, 100);
        }

        themeSelect.addEventListener('change', (e) => {
            document.body.className = 'theme-' + e.target.value;
        });

        patternSelect.addEventListener('change', () => {
            if (isRunning) startTime = performance.now();
        });

        playBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            if (isRunning) {
                playBtn.innerText = "PAUSE";
                playBtn.classList.add('active');
                
                // Force mobile hardware audio active fresh on every start click
                startAudioEngine();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                startTime = performance.now();
                requestAnimationFrame(animate);
            } else {
                playBtn.innerText = "START";
                playBtn.classList.remove('active');
                instructionText.innerText = "PAUSED";
                countdownText.innerText = "--";
                
                // Tear down engine on pause so mobile hardware releases control cleanly
                stopAudioEngine();
            }
        });

        soundBtn.addEventListener('click', () => {
            isSoundOn = !isSoundOn;
            if (isSoundOn) {
                soundBtn.innerText = "SOUND: ON";
                soundBtn.classList.add('active');
                if (isRunning && !audioCtx) {
                    startAudioEngine();
                }
            } else {
                soundBtn.innerText = "SOUND: OFF";
                soundBtn.classList.remove('active');
                if (gainNode && audioCtx) {
                    gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
                }
            }
        });

        function drawGeometry(cx, cy, radius, sides, glowColor) {
            ctx.strokeStyle = glowColor;
            ctx.beginPath();
            for (let i = 0; i <= sides; i++) {
                let angle = (i * 2 * Math.PI) / sides - Math.PI / 2;
                let x = cx + radius * Math.cos(angle);
                let y = cy + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();

            if (sides > 4) {
                ctx.lineWidth = 0.5;
                for (let i = 0; i < sides; i++) {
                    let angleI = (i * 2 * Math.PI) / sides - Math.PI / 2;
                    let x1 = cx + radius * Math.cos(angleI);
                    let y1 = cy + radius * Math.sin(angleI);
                    for (let j = i + 2; j < sides; j++) {
                        let angleJ = (j * 2 * Math.PI) / sides - Math.PI / 2;
                        let x2 = cx + radius * Math.cos(angleJ);
                        let y2 = cy + radius * Math.sin(angleJ);
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.stroke();
                    }
                }
                ctx.lineWidth = 2;
            }
        }

        function animate(timestamp) {
            if (!isRunning) return;

            const currentStyles = getComputedStyle(document.body);
            const lineColor = currentStyles.getPropertyValue('--accent-line').trim();
            const glowColor = currentStyles.getPropertyValue('--accent-glow').trim();
            const frameColor = currentStyles.getPropertyValue('--border-ui').trim();

            const selectedPattern = patterns[patternSelect.value];
            const totalCycle = selectedPattern.inhale + selectedPattern.hold1 + selectedPattern.exhale + selectedPattern.hold2;
            
            const elapsed = (timestamp - startTime) % totalCycle;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let progress = 0;
            let currentAction = "";
            let scale = 1.0;
            let currentVolume = 0;
            let secondsLeft = 0;

            const { inhale, hold1, exhale, hold2 } = selectedPattern;

            if (elapsed < inhale) {
                currentAction = "Inhale";
                progress = elapsed / inhale;
                scale = 0.25 + (progress * 0.75);
                secondsLeft = Math.ceil((inhale - elapsed) / 1000);
                currentVolume = isSoundOn ? 0.05 + (progress * 0.15) : 0;
            } else if (elapsed < inhale + hold1) {
                currentAction = "Hold";
                progress = (elapsed - inhale) / hold1;
                scale = 1.0;
                secondsLeft = Math.ceil((inhale + hold1 - elapsed) / 1000);
                currentVolume = isSoundOn ? 0.20 : 0;
            } else if (elapsed < inhale + hold1 + exhale) {
                currentAction = "Exhale";
                progress = (elapsed - inhale - hold1) / exhale;
                scale = 1.0 - (progress * 0.75);
                secondsLeft = Math.ceil((inhale + hold1 + exhale - elapsed) / 1000);
                currentVolume = isSoundOn ? 0.20 - (progress * 0.15) : 0;
            } else {
                currentAction = "Sustain";
                progress = (elapsed - inhale - hold1 - exhale) / hold2;
                scale = 0.25;
                secondsLeft = Math.ceil((totalCycle - elapsed) / 1000);
                currentVolume = isSoundOn ? 0.05 : 0;
            }

            instructionText.innerText = currentAction;
            countdownText.innerText = secondsLeft;

            if (isSoundOn && gainNode && audioCtx) {
                gainNode.gain.setTargetAtTime(currentVolume, audioCtx.currentTime, 0.03);
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const maxRadius = 105;
            const currentRadius = maxRadius * scale;

            ctx.lineWidth = 2;

            ctx.strokeStyle = frameColor;
            ctx.beginPath();
            ctx.arc(centerX, centerY, maxRadius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = lineColor;
            ctx.beginPath();
            ctx.arc(centerX, centerY, currentRadius, 0, Math.PI * 2);
            ctx.stroke();

            const sidesCount = parseInt(geometrySlider.value);
            drawGeometry(centerX, centerY, currentRadius, sidesCount, glowColor);

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
